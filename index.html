<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mein Editor</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/stex/stex.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/search/searchcursor.min.js"></script>
    
    <link href="style.css" rel="stylesheet">
    
    <script src="script.js" defer></script>
</head>
<body>

    <header class="top-nav">
        <nav>
            <ul id="headbarNav">
                <li>
                    <div class="dropdownDatei">
                        <button id="datei" class="datei-btn">File</button>
                        <div id="dropdownDateiContent" class="dropdownDateiClass">
                            <a href="#link1">Link 1</a>
                            <a href="#link2">Link 2</a>
                            <a href="#link3">Link 3</a>
                        </div>
                    </div>
                </li>
                <li>
                    <div class="dropdownEdit">
                        <button id="edit" class="edit-btn">Edit</button>
                        <div id="dropdownEditContent" class="dropdownEditClass">
                            <a href="#link1">Undo</a>
                            <a href="#link2">Redo</a>
                            <a href="#link3">Cut</a>
                            <a href="#link4">Copy</a>
                            <a href="#link5">Paste</a>
                        </div>
                    </div>
                </li>
                <li>
                    <div class="dropdownImport">
                        <button id="import" class="import-btn">Import</button>
                        <div id="dropdownImportContent" class="dropdownImportClass">
                            <a href="#link1">Link 1</a>
                            <a href="#link2">Link 2</a>
                            <a href="#link3">Link 3</a>
                        </div>
                    </div>    
                </li>
                <li>
                    <div class="dropdownHelp">
                        <button id="help" class="help-btn">Help</button>
                        <div id="dropdownHelpContent" class="dropdownHelpClass">
                            <a href="#link1">Keyboard shortcuts</a>
                            <a href="#link2">Contact us</a>
                        </div>
                    </div>
                </li>
            </ul>
        </nav>
    </header>
    
    <aside class="sidebar">
        <nav>
            <ul>
                <li>
                    <form id="search-form">
    <input placeholder="Suchen..." id="input1">
    <div class="dropdownSelektor">
        <select id="selektor" class="selektor-btn">
    <option value="original">Original</option>
    <option value="asc">A-Z (Key)</option>
    <option value="desc">Z-A (Key)</option>
    <option value="type">Nach Typ (@article, @book...)</option> </select>
    </div>
</form>
                </li>
            </ul>
        </nav>
        
        <div class="citations-container">
            <ul id="citation-list">
                </ul>
        </div>
    </aside>

    <main class="editor-container"> 
        <textarea id="editor-textarea">
@article{beispiel,
  author  = "Autor, A.",
  title   = "Ein Titel",
  year    = 2025
}
        </textarea>
    </main>

</body>
</html>
