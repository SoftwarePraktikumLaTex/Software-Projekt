<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mein Editor</title>
    <script src="script.js" type="module" defer></script>
    <link href="style.css" rel="stylesheet"> </head>
<body>

    <header class="top-nav">
        <nav>
            <ul id="headbarNav">
                <li>
                    <div class="dropdownDatei">
                        <button id="datei" class="datei-btn">File</button>

                        <div id="dropdownDateiContent" class="dropdownDateiClass">
                            <a href="#link1">Link 1</a>
                            <a href="#link2">Link 2</a>
                            <a href="#link3">Link 3</a>
                        </div>
                    </div>
                </li>
                <li>
                    <div class="dropdownEdit">
                        <button id="edit" class="edit-btn">Edit</button>

                        <div id="dropdownEditContent" class="dropdownEditClass">
                            <a href="#link1">Undo</a>
                            <a href="#link2">Redo</a>
                            <a href="#link3">Cut</a>
                            <a href="#link4">Copy</a>
                            <a href="#link5">Paste</a>
                        </div>
                    </div>
                </li>
                <li>
                    <div class="dropdownImport">
                        <button id="import" class="import-btn">Import</button>

                        <div id="dropdownImportContent" class="dropdownImportClass">
                            <a href="#link1">Link 1</a>
                            <a href="#link2">Link 2</a>
                            <a href="#link3">Link 3</a>
                        </div>
                    </div>    
                </li>
                <li>
                    <div class="dropdownHelp">
                        <button id="help" class="help-btn">Help</button>

                        <div id="dropdownHelpContent" class="dropdownHelpClass">
                            <a href="#link1">Keyboard shortcuts</a>
                            <a href="#link2">Contact us</a>
                        </div>
                    </div>
                </li>
            </ul>
        </nav>
    </header>
    
    <aside class="sidebar">
    <nav>
        <ul>
            <li>
                <form id="search-form">
                    <input placeholder="Suchen..." id="input1">
                    <div class="dropdownSelektor">
                        <select id="selektor" class="selektor-btn">
                            <option value="a-z">A-Z</option>
			                <option value="option">Option1</option>
			                <option value="option2">Option2</option>
			                <option value="option3">Option3</option>
                        </select>
                        </div>
                    </div>
                </form>
            </li>
        </ul>
    </nav>
    
    <div class="citations-container">
        <ul id="citation-list">
            </ul>
    </div>
</aside>

    <main class="editor-container"> 
        <form id="form">
            <textarea id="editor-textarea" placeholder="Schreibe hier ..."></textarea>
        </form>
    </main>

</body>
</html>
